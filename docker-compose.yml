version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: agri-gi-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: agri_gi
    networks:
      - agri-gi-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agri-gi-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/agri_gi
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - agri-gi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agri-gi-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3001/api
    depends_on:
      - backend
    networks:
      - agri-gi-network

volumes:
  mongodb_data:

networks:
  agri-gi-network:
    driver: bridge
